[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dynamizer-api"
version = "0.1.0"
description = "Dynamizer backend — real-time social games API"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111.0"
uvicorn = { version = ">=0.29.0", extras = ["standard"] }
python-socketio = ">=5.11.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
redis = ">=5.0.0"
asyncpg = ">=0.29.0"
sqlalchemy = ">=2.0.0"
alembic = ">=1.13.0"
python-dotenv = ">=1.0.0"
shortuuid = ">=1.0.13"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=5.0.0"
httpx = ">=0.27.0"
python-socketio = { version = ">=5.11.0", extras = ["asyncio_client"] }
ruff = ">=0.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
